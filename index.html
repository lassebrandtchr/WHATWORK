<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101215" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="WHATWORK — bygget til funktionel fitness. Fortæl hvor lang tid I har, hvem der træner, og hvilket udstyr der er. Så bygger appen workouten med kilo, mål og pauser." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WHATWORK?" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <title>WHATWORK?</title>
    <script>
      /*
       * Temaet sættes før stylesheet og app indlæses, så appen aldrig blinker lys
       * på vej mod mørk. Dark Mode er standard, og valget ligger i localStorage.
       */
      (function () {
        try {
          var saved = localStorage.getItem('whatwork.theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
